  <style>
    :root {
      --bg-cream: #F9F6F0;
      --bg-card: #FFFFFF;
      --bg-accent: #EFE9DD;
      --primary-green: #244134;
      --secondary-green: #375949;
      --gold: #C09A58;
      --text-dark: #1F2421;
      --text-muted: #646E68;
      --border-color: #E2DBD0;
      --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-dark);
      line-height: 1.6;
    }

    h1, h2, h3, h4, .font-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* BARRE DU HAUT / NAVIGATION */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: rgba(249, 246, 240, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--primary-green);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 1.8rem;
      align-items: center;
    }

    .nav-links a {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-dark);
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .btn-contact {
      background-color: var(--primary-green);
      color: #fff !important;
      padding: 0.6rem 1.3rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .btn-contact:hover {
      background-color: var(--secondary-green);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(36, 65, 52, 0.25);
    }

    /* HERO BANNER */
    .hero {
      position: relative;
      background: linear-gradient(rgba(26, 42, 34, 0.78), rgba(26, 42, 34, 0.88)), 
                  url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      color: white;
      text-align: center;
      padding: 7rem 1.5rem 6rem;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.4rem 1.2rem;
      border-radius: 30px;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 1rem;
      line-height: 1.15;
    }

    .hero p {
      font-size: 1.15rem;
      max-width: 650px;
      margin: 0 auto 2.2rem;
      font-weight: 300;
      color: #E2DBD0;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      background-color: var(--gold);
      color: white;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .btn-primary:hover {
      background-color: #A98344;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: transparent;
      color: white;
      border: 2px solid white;
      padding: 0.85rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .btn-secondary:hover {
      background-color: white;
      color: var(--primary-green);
      transform: translateY(-2px);
    }

    /* SECTION A PROPOS & INFOS RAPIDES */
    .features {
      max-width: 1100px;
      margin: -2.5rem auto 3rem;
      padding: 0 1.5rem;
      position: relative;
      z-index: 10;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }
